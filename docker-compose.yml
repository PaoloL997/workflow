# Storage S3 per foto profilo e firme, sul server Windows accanto all'app
# (IIS + Waitress, vedi README). Serve un Docker che esegue container Linux:
# `docker info --format "{{.OSType}}"` deve rispondere `linux`.
#
# Avvio: `docker compose up -d` dalla cartella del progetto. Le variabili
# arrivano dal file .env dell'applicazione, lo stesso che legge Django.
services:
  # Garage in modalità nodo singolo: all'avvio crea da solo la chiave d'accesso
  # e il bucket privato dalle variabili S3_*. Pubblicato solo su 127.0.0.1: lo
  # raggiunge Waitress sulla stessa macchina, i browser no (le immagini le
  # serve l'app agli utenti loggati).
  storage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Imposta GARAGE_RPC_SECRET nel file .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Imposta S3_ACCESS_KEY nel file .env}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Imposta S3_SECRET_KEY nel file .env}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:?Imposta S3_BUCKET nel file .env}
    ports:
      # Cambiando la porta va cambiato anche S3_ENDPOINT_URL nel .env.
      - "127.0.0.1:3900:3900"
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      # Immagine senza shell né curl: si usa il binario di Garage.
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  garage_meta:
  garage_data:
