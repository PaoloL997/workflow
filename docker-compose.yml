services:
  web:
    build:
      context: .
    restart: unless-stopped
    network_mode: host
    command: ["/entrypoint.sh", "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8004", "--workers", "3", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: ${DEBUG:-False}
      FILESERVER_JOBS_PATH: ${FILESERVER_JOBS_PATH:-/app/fileserver}
      USE_X_FORWARDED_HOST: "True"
      USE_X_FORWARDED_PROTO: ${USE_X_FORWARDED_PROTO:-False}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - logs_data:/app/logs
      - ${FILESERVER_HOST_PATH}:${FILESERVER_JOBS_PATH:-/app/fileserver}:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${APP_PORT:-8000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro

volumes:
  static_data:
  media_data:
  logs_data:
