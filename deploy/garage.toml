# Garage: storage S3 per i file caricati dagli utenti (foto profilo e firme).
#
# Nodo singolo, senza replica. All'avvio `garage server --single-node
# --default-bucket` (vedi docker-compose.yml) crea il layout del cluster, la
# chiave d'accesso e il bucket dalle variabili GARAGE_DEFAULT_*. Il segreto
# RPC arriva da GARAGE_RPC_SECRET, quindi qui non c'è nessuna credenziale.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# Pochi file e poche scritture: l'fsync costa poco e protegge i dati da
# un'interruzione di corrente.
metadata_fsync = true
data_fsync = true
metadata_auto_snapshot_interval = "6h"

replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Deve coincidere con S3_REGION nel .env (firma delle richieste SigV4).
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
