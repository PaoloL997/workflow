<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    background: var(--color-bg);
  }

  .auth-logo {
    height: 72px;
    width: auto;
    object-fit: contain;
    margin-bottom: 40px;
    filter: drop-shadow(0 2px 6px hsla(0,0%,0%,0.12));
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--color-surface);
    border-radius: var(--radius-xl);
    padding: 40px;
    box-shadow: var(--shadow-elevated);
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .auth-card h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--color-text-primary);
    text-align: center;
    margin-bottom: 4px;
  }

  .auth-subtitle {
    font-size: 14px;
    color: var(--color-text-secondary);
    text-align: center;
    line-height: 1.5;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    letter-spacing: 0.01em;
  }

  .field input {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--color-border);
    background: var(--color-elevated);
    color: var(--color-text-primary);
    font-size: 15px;
    transition: border-color 0.18s, box-shadow 0.18s;
    box-shadow:
      inset 0 1px 3px hsla(0,0%,0%,0.06),
      inset 0 -1px 1px hsla(0,0%,100%,0.04);
  }

  .field input:focus {
    border-color: var(--color-accent);
    box-shadow:
      0 0 0 3px hsla(211,100%,50%,0.15),
      inset 0 1px 3px hsla(0,0%,0%,0.04);
    background: var(--color-bg);
  }

  .auth-error {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    background: hsla(4,90%,58%,0.10);
    border: 1px solid hsla(4,90%,58%,0.25);
    color: var(--color-danger);
    font-size: 14px;
  }

  .auth-info {
    padding: 12px 14px;
    border-radius: var(--radius-md);
    background: hsla(211,100%,50%,0.08);
    border: 1px solid hsla(211,100%,50%,0.20);
    color: var(--color-text-secondary);
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
  }

  .btn-auth {
    width: 100%;
    padding: 13px 24px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, hsl(211,100%,56%), hsl(211,100%,50%));
    box-shadow:
      inset 0 1px 0 hsla(0,0%,100%,0.20),
      0 2px 8px hsla(211,100%,50%,0.35);
    transition: filter 0.18s, transform 0.12s, box-shadow 0.18s;
  }

  .btn-auth:hover {
    filter: brightness(1.08);
    box-shadow:
      inset 0 1px 0 hsla(0,0%,100%,0.22),
      0 4px 16px hsla(211,100%,50%,0.45);
  }

  .btn-auth:active {
    transform: scale(0.98);
    filter: brightness(0.96);
  }

  .auth-footer {
    font-size: 14px;
    color: var(--color-text-secondary);
    text-align: center;
  }

  .auth-footer a {
    color: var(--color-accent);
    font-weight: 500;
  }

  .theme-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--color-elevated);
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.18s, box-shadow 0.18s, transform 0.12s;
    z-index: 90;
  }

  .theme-toggle:hover {
    box-shadow: var(--shadow-elevated);
    background: var(--color-surface);
  }

  .theme-toggle:active { transform: scale(0.96); }

  .theme-toggle .icon-sun  { display: none; }
  .theme-toggle .icon-moon { display: block; }

  :root[data-theme="dark"] .field input:focus {
    box-shadow:
      0 0 0 3px hsl(215 80% 60% / 0.15),
      inset 0 1px 3px hsla(0,0%,0%,0.04);
  }
  :root[data-theme="dark"] .btn-auth {
    background: linear-gradient(180deg, hsl(215 80% 60%), hsl(215 80% 50%));
    box-shadow:
      inset 0 1px 0 hsla(0,0%,100%,0.20),
      0 2px 8px hsl(215 80% 50% / 0.35);
  }
  :root[data-theme="dark"] .btn-auth:hover {
    box-shadow:
      inset 0 1px 0 hsla(0,0%,100%,0.22),
      0 4px 16px hsl(215 80% 50% / 0.45);
  }
  :root[data-theme="dark"] .theme-toggle .icon-sun  { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .field input:focus {
      box-shadow:
        0 0 0 3px hsl(215 80% 60% / 0.15),
        inset 0 1px 3px hsla(0,0%,0%,0.04);
    }
    :root:not([data-theme="light"]) .btn-auth {
      background: linear-gradient(180deg, hsl(215 80% 60%), hsl(215 80% 50%));
      box-shadow:
        inset 0 1px 0 hsla(0,0%,100%,0.20),
        0 2px 8px hsl(215 80% 50% / 0.35);
    }
    :root:not([data-theme="light"]) .btn-auth:hover {
      box-shadow:
        inset 0 1px 0 hsla(0,0%,100%,0.22),
        0 4px 16px hsl(215 80% 50% / 0.45);
    }
    :root:not([data-theme="light"]) .theme-toggle .icon-sun  { display: block; }
    :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
  }
</style>
