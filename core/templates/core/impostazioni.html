{% extends 'core/base.html' %}

{% block title %}Impostazioni — Brembana&amp;Rolle{% endblock %}
{% block nav_impostazioni %}active{% endblock %}

{% block extra_css %}
<style>
    .settings-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        max-width: 400px;
    }

    .settings-card {
        background: #FFFFFF;
        border: 1px solid #E0DFDB;
        border-radius: 12px;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .settings-card-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: #1C1C1A;
    }

    /* Add form */
    .add-form {
        display: flex;
        gap: 0.5rem;
    }

    .add-form input {
        flex: 1;
        padding: 0.45rem 0.75rem;
        font-size: 0.85rem;
        border: 1px solid #D8D7D2;
        border-radius: 7px;
        background: #FAFAF9;
        color: #1C1C1A;
        outline: none;
        font-family: inherit;
        transition: border-color .15s;
    }
    .add-form input:focus { border-color: #9CA3AF; background: #fff; }
    .add-form input::placeholder { color: #AEADA8; }

    .btn-add {
        padding: 0.45rem 0.85rem;
        font-size: 0.82rem;
        font-weight: 600;
        background: #1C1C1A;
        color: #fff;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        white-space: nowrap;
        transition: opacity .15s;
    }
    .btn-add:hover { opacity: 0.82; }
    .btn-add:disabled { opacity: 0.4; cursor: default; }

    /* List */
    .item-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        max-height: 420px;
        overflow-y: auto;
    }

    .item-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.6rem;
        border-radius: 7px;
        background: #F5F4F0;
    }

    .item-row-name {
        flex: 1;
        font-size: 0.855rem;
        color: #1C1C1A;
        cursor: default;
    }

    .item-row-input {
        flex: 1;
        padding: 0.3rem 0.5rem;
        font-size: 0.85rem;
        border: 1px solid #D8D7D2;
        border-radius: 5px;
        background: #fff;
        color: #1C1C1A;
        font-family: inherit;
        outline: none;
        display: none;
    }
    .item-row-input:focus { border-color: #9CA3AF; }

    .item-row.editing .item-row-name { display: none; }
    .item-row.editing .item-row-input { display: block; }

    .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.2rem;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6B6B67;
        transition: background .12s, color .12s;
        flex-shrink: 0;
    }
    .btn-icon:hover { background: #E0DFDB; color: #1C1C1A; }
    .btn-icon.danger:hover { background: #FEF2F2; color: #EF4444; }
    .btn-icon svg { width: 15px; height: 15px; }

    .error-msg {
        font-size: 0.78rem;
        color: #B91C1C;
        min-height: 1.1rem;
    }

    .empty-msg {
        font-size: 0.82rem;
        color: #AEADA8;
        padding: 0.5rem 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Impostazioni</h1>
</div>

<div class="settings-grid">

    <!-- Stati Esterni -->
    <div class="settings-card" id="card-stati-esterni">
        <div class="settings-card-title">Risposte del cliente</div>
        <div class="add-form">
            <input type="text" id="input-new-stato-esterno" placeholder="Nuova risposta…" maxlength="100">
            <input type="color" id="input-color-stato-esterno" value="#9E9E9E" title="Colore" style="width:36px;height:32px;padding:2px;border:1px solid #D8D7D2;border-radius:5px;cursor:pointer;">
            <button class="btn-add" onclick="addItem('stati-esterni')">Aggiungi</button>
        </div>
        <div class="error-msg" id="err-stati-esterni"></div>
        <ul class="item-list" id="list-stati-esterni"></ul>
    </div>

</div>

<script>
const CSRF = document.cookie.match(/csrftoken=([^;]+)/)?.[1] ?? '';

const CONFIG = {
    'stati-esterni': { listKey: 'stati',    inputId: 'input-new-stato-esterno', errId: 'err-stati-esterni', listId: 'list-stati-esterni', colorInputId: 'input-color-stato-esterno' },
};

async function api(method, url, body) {
    const opts = { method, headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    return { ok: res.ok, status: res.status, data: await res.json() };
}

function setError(errId, msg) {
    document.getElementById(errId).textContent = msg || '';
}

function renderList(type, items) {
    const { listId } = CONFIG[type];
    const ul = document.getElementById(listId);
    ul.innerHTML = '';
    if (!items.length) {
        ul.innerHTML = '<li class="empty-msg">Nessun elemento.</li>';
        return;
    }
    items.forEach(item => ul.appendChild(buildRow(type, item)));
}

function buildRow(type, item) {
    const li = document.createElement('li');
    li.className = 'item-row';
    li.dataset.id = item.id;

    // Color swatch for stati-esterni
    let colorInput = null;
    if (type === 'stati-esterni') {
        colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.className = 'item-row-color';
        colorInput.value = item.colore || '#9E9E9E';
        colorInput.title = 'Colore';
        colorInput.style.cssText = 'width:28px;height:28px;padding:1px;border:1px solid #D8D7D2;border-radius:5px;cursor:pointer;flex-shrink:0;';
        colorInput.addEventListener('change', () => saveColor(type, li, colorInput));
    }

    const nameSpan = document.createElement('span');
    nameSpan.className = 'item-row-name';
    nameSpan.textContent = item.nome;

    const editInput = document.createElement('input');
    editInput.className = 'item-row-input';
    editInput.type = 'text';
    editInput.value = item.nome;
    editInput.maxLength = 100;

    // Edit button
    const btnEdit = document.createElement('button');
    btnEdit.className = 'btn-icon';
    btnEdit.title = 'Modifica';
    btnEdit.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125" /></svg>`;
    btnEdit.onclick = () => startEdit(li, editInput, btnEdit, btnSave, btnCancel);

    // Save button
    const btnSave = document.createElement('button');
    btnSave.className = 'btn-icon';
    btnSave.title = 'Salva';
    btnSave.style.display = 'none';
    btnSave.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>`;
    btnSave.onclick = () => saveEdit(type, li, editInput, nameSpan, btnEdit, btnSave, btnCancel);

    // Cancel button
    const btnCancel = document.createElement('button');
    btnCancel.className = 'btn-icon';
    btnCancel.title = 'Annulla';
    btnCancel.style.display = 'none';
    btnCancel.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>`;
    btnCancel.onclick = () => cancelEdit(li, editInput, nameSpan, btnEdit, btnSave, btnCancel);

    // Delete button
    const btnDel = document.createElement('button');
    btnDel.className = 'btn-icon danger';
    btnDel.title = 'Elimina';
    btnDel.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>`;
    btnDel.onclick = () => deleteItem(type, li);

    editInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') btnSave.click();
        if (e.key === 'Escape') btnCancel.click();
    });

    li.append(...[colorInput, nameSpan, editInput, btnEdit, btnSave, btnCancel, btnDel].filter(Boolean));
    return li;
}

function startEdit(li, input, btnEdit, btnSave, btnCancel) {
    li.classList.add('editing');
    btnEdit.style.display = 'none';
    btnSave.style.display = 'flex';
    btnCancel.style.display = 'flex';
    input.focus();
    input.select();
}

function cancelEdit(li, input, nameSpan, btnEdit, btnSave, btnCancel) {
    input.value = nameSpan.textContent;
    li.classList.remove('editing');
    btnEdit.style.display = 'flex';
    btnSave.style.display = 'none';
    btnCancel.style.display = 'none';
}

async function saveEdit(type, li, input, nameSpan, btnEdit, btnSave, btnCancel) {
    const nome = input.value.trim();
    if (!nome) return;
    const pk = li.dataset.id;
    const { ok, data } = await api('PATCH', `/api/${type}/${pk}/`, { nome });
    if (ok) {
        nameSpan.textContent = data.data.nome;
        input.value = data.data.nome;
        cancelEdit(li, input, nameSpan, btnEdit, btnSave, btnCancel);
    } else {
        alert(data.error || 'Errore durante il salvataggio.');
    }
}

async function saveColor(type, li, colorInput) {
    const pk = li.dataset.id;
    const { ok } = await api('PATCH', `/api/${type}/${pk}/`, { colore: colorInput.value });
    if (!ok) alert('Errore durante il salvataggio del colore.');
}

async function deleteItem(type, li) {
    if (!confirm('Eliminare questo elemento?')) return;
    const pk = li.dataset.id;
    const { ok, data } = await api('DELETE', `/api/${type}/${pk}/`);
    if (ok) {
        li.remove();
        const ul = li.parentElement;
        if (ul && !ul.querySelector('.item-row')) {
            ul.innerHTML = '<li class="empty-msg">Nessun elemento.</li>';
        }
    } else {
        alert(data.error || 'Errore durante l\'eliminazione.');
    }
}

async function addItem(type) {
    const { inputId, errId, listId, listKey, colorInputId } = CONFIG[type];
    const input = document.getElementById(inputId);
    const nome = input.value.trim();
    setError(errId, '');
    if (!nome) { setError(errId, 'Inserisci un nome.'); return; }

    const body = { nome };
    if (colorInputId) {
        const colorEl = document.getElementById(colorInputId);
        body.colore = colorEl ? colorEl.value : '';
    }
    const { ok, data } = await api('POST', `/api/${type}/`, body);
    if (ok) {
        input.value = '';
        const ul = document.getElementById(listId);
        const emptyMsg = ul.querySelector('.empty-msg');
        if (emptyMsg) emptyMsg.remove();
        ul.appendChild(buildRow(type, data.data));
    } else {
        setError(errId, data.error || 'Errore durante l\'aggiunta.');
    }
}

async function loadAll() {
    for (const [type, cfg] of Object.entries(CONFIG)) {
        const { ok, data } = await api('GET', `/api/${type}/`);
        if (ok) renderList(type, data[cfg.listKey] || []);
    }
}

// Allow Enter key on add inputs
Object.values(CONFIG).forEach(({ inputId, listKey }) => {
    const input = document.getElementById(inputId);
    if (input) {
        const type = Object.keys(CONFIG).find(k => CONFIG[k].inputId === inputId);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(type); });
    }
});

loadAll();
</script>
{% endblock %}
