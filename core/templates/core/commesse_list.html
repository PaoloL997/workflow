{% extends 'core/base.html' %}
{% load static %}

{% block title %}Elenco Commesse{% endblock %}

{% block extra_head %}
<style>
  /* ── Page shell ── */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 48px 80px;
    position: relative;
  }

  /* ── Navbar ── */
  .navbar {
    width: 100%;
    max-width: 1280px;
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 28px 0 0;
    margin-bottom: 64px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 999px;
    background: transparent;
    color: var(--color-text-secondary);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: color 0.18s, background 0.18s;
    text-decoration: none;
    border: none;
    cursor: pointer;
    position: relative;
  }

  .nav-item:hover {
    color: var(--color-text-primary);
    background: transparent;
    text-decoration: none;
  }

  .nav-item.active {
    color: var(--color-accent);
    font-weight: 600;
    background: transparent;
  }

  .nav-item svg {
    flex-shrink: 0;
    opacity: 0.55;
    transition: opacity 0.18s;
  }

  .nav-item:hover svg  { opacity: 0.8; }
  .nav-item.active svg { opacity: 1; }

  .nav-badge {
    display: inline-block;
    position: absolute;
    top: 6px;
    right: 14px;
    width: 7px;
    height: 7px;
    background: var(--color-danger);
    border-radius: 50%;
  }

  /* ── Page header ── */
  .list-header {
    width: 100%;
    max-width: 1280px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    padding: 48px 0 40px;
  }

  .list-header h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--color-text-primary);
    text-align: center;
  }

  .list-count {
    font-size: 14px;
    color: var(--color-text-secondary);
  }

  /* ── Grid ── */
  .commesse-grid {
    width: 100%;
    max-width: 1280px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  @media (max-width: 1024px) {
    .commesse-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 720px) {
    .commesse-grid { grid-template-columns: repeat(2, 1fr); }
    .page { padding: 0 24px 64px; }
  }

  @media (max-width: 480px) {
    .commesse-grid { grid-template-columns: 1fr; }
  }

  .commessa-card {
    position: relative;
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
    color: inherit;
  }

  .commessa-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-elevated);
    text-decoration: none;
  }

  .card-pin {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 8px;
    color: var(--color-text-secondary);
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
    z-index: 2;
    padding: 0;
  }

  .commessa-card:hover .card-pin { opacity: 0.8; }

  .card-pin:hover {
    opacity: 1;
    background: hsla(211, 100%, 50%, 0.1);
    color: var(--color-accent);
  }

  .card-pin.pinned {
    opacity: 1;
    color: var(--color-accent);
  }

  .card-job {
    font-size: 14px;
    font-weight: 700;
    color: var(--color-accent);
    letter-spacing: -0.01em;
    padding-right: 28px;
  }

  .card-client {
    font-size: 16px;
    font-weight: 700;
    color: var(--color-text-primary);
    letter-spacing: -0.02em;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-detail {
    font-size: 14px;
    color: var(--color-text-secondary);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    font-size: 12px;
    color: var(--color-text-secondary);
  }

  .card-footer svg { opacity: 0.6; }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 24px;
    color: var(--color-text-secondary);
    font-size: 15px;
  }

  /* ── Theme toggle ── */
  .theme-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--color-elevated);
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.18s, box-shadow 0.18s, transform 0.12s;
    z-index: 90;
  }

  .theme-toggle:hover {
    box-shadow: var(--shadow-elevated);
    background: var(--color-surface);
  }

  .theme-toggle:active { transform: scale(0.96); }

  .theme-toggle .icon-sun  { display: none; }
  .theme-toggle .icon-moon { display: block; }

  :root[data-theme="dark"] .theme-toggle .icon-sun  { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .icon-sun  { display: block; }
    :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
  }
</style>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
  'use strict';

  /* ── Theme toggle ── */
  (function () {
    var btn = document.getElementById('theme-toggle-btn');
    btn.addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme');
      var isDark = current === 'dark' ||
        (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  })();

  /* ── Utilities ── */
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── State ── */
  var allCommesse = [];
  var CSRF = document.cookie.match(/workflow_csrftoken=([^;]+)/)?.[1] ?? '';

  function pinIconSvg(filled) {
    var fill = filled ? 'currentColor' : 'none';
    var stroke = filled ? 'none' : 'currentColor';
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.8" aria-hidden="true">' +
      '<path d="M16 12V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>' +
      '</svg>';
  }

  /* ── Load all commesse ── */
  async function loadCommesse() {
    var grid = document.getElementById('commesse-grid');
    try {
      var res = await fetch('/api/commesse/');
      if (!res.ok) throw new Error();
      var data = await res.json();
      allCommesse = data.commesse || [];
      renderGrid(allCommesse);
    } catch {
      grid.innerHTML = '<div class="empty-state">Impossibile caricare le commesse.</div>';
      document.getElementById('list-count').textContent = '';
    }
  }

  function renderGrid(commesse) {
    var grid = document.getElementById('commesse-grid');
    var count = document.getElementById('list-count');

    count.textContent = commesse.length
      ? commesse.length + ' commess' + (commesse.length === 1 ? 'a' : 'e')
      : '';

    if (!commesse.length) {
      grid.innerHTML = '<div class="empty-state">Nessuna commessa trovata.</div>';
      return;
    }

    grid.innerHTML = commesse.map(function (c) {
      var pinned = !!c.pinned;
      return '<a href="/commesse/' + encodeURIComponent(c.job) + '/" class="commessa-card" aria-label="Commessa ' + escHtml(c.job) + '">' +
        '<button type="button" class="card-pin' + (pinned ? ' pinned' : '') + '"' +
          ' data-job="' + escHtml(c.job) + '" data-pinned="' + (pinned ? '1' : '0') + '"' +
          ' aria-label="' + (pinned ? 'Rimuovi pin' : 'Pinna commessa') + '"' +
          ' title="' + (pinned ? 'Rimuovi pin' : 'Pinna commessa') + '">' +
          pinIconSvg(pinned) +
        '</button>' +
        '<div class="card-job">' + escHtml(c.job) + '</div>' +
        '<div class="card-client">' + escHtml(c.client || '—') + '</div>' +
        (c.job_detail ? '<div class="card-detail">' + escHtml(c.job_detail) + '</div>' : '') +
        '<div class="card-footer">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
            '<path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/>' +
          '</svg>' +
          formatDate(c.delivery_date) +
        '</div>' +
      '</a>';
    }).join('');

    grid.querySelectorAll('.card-pin').forEach(function (btn) {
      btn.addEventListener('click', onPinClick);
    });
  }

  async function onPinClick(e) {
    e.preventDefault();
    e.stopPropagation();
    var btn = e.currentTarget;
    var job = btn.dataset.job;
    var pinned = btn.dataset.pinned === '1';
    var method = pinned ? 'DELETE' : 'POST';
    btn.disabled = true;
    try {
      var res = await fetch('/api/commesse/' + encodeURIComponent(job) + '/pin/', {
        method: method,
        headers: { 'X-CSRFToken': CSRF },
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        alert(data.error || 'Impossibile aggiornare il pin.');
        return;
      }
      await loadCommesse();
    } catch {
      alert('Impossibile aggiornare il pin.');
    } finally {
      btn.disabled = false;
    }
  }

  /* ── Init ── */
  loadCommesse();
})();
</script>
{% endblock %}
