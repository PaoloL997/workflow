{% extends 'core/base.html' %}
{% load static %}

{% block title %}Registrati{% endblock %}

{% block extra_head %}
<style>
  /* ── Auth page layout ── */
  .auth-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    background: var(--color-bg);
  }

  .auth-logo {
    height: 72px;
    width: auto;
    object-fit: contain;
    margin-bottom: 40px;
    filter: drop-shadow(0 2px 6px hsla(0,0%,0%,0.12));
  }

  /* ── Card ── */
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--color-surface);
    border-radius: var(--radius-xl);
    padding: 40px;
    box-shadow: var(--shadow-elevated);
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .auth-card h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--color-text-primary);
    text-align: center;
    margin-bottom: 4px;
  }

  .auth-subtitle {
    font-size: 14px;
    color: var(--color-text-secondary);
    text-align: center;
  }

  /* ── Form fields ── */
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    letter-spacing: 0.01em;
  }

  .field input {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--color-border);
    background: var(--color-elevated);
    color: var(--color-text-primary);
    font-size: 15px;
    transition: border-color 0.18s, box-shadow 0.18s;
    box-shadow:
      inset 0 1px 3px hsla(0,0%,0%,0.06),
      inset 0 -1px 1px hsla(0,0%,100%,0.04);
  }

  .field input:focus {
    border-color: var(--color-accent);
    box-shadow:
      0 0 0 3px hsla(211,100%,50%,0.15),
      inset 0 1px 3px hsla(0,0%,0%,0.04);
    background: var(--color-bg);
  }

  /* ── Divider ── */
  .field-divider {
    height: 1px;
    background: var(--color-border);
    margin: 4px 0;
  }

  /* ── Error banner ── */
  .auth-error {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    background: hsla(4,90%,58%,0.10);
    border: 1px solid hsla(4,90%,58%,0.25);
    color: var(--color-danger);
    font-size: 14px;
  }

  /* ── Submit button ── */
  .btn-auth {
    width: 100%;
    padding: 13px 24px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, hsl(211,100%,56%), hsl(211,100%,50%));
    box-shadow:
      inset 0 1px 0 hsla(0,0%,100%,0.20),
      0 2px 8px hsla(211,100%,50%,0.35);
    transition: filter 0.18s, transform 0.12s, box-shadow 0.18s;
  }

  .btn-auth:hover {
    filter: brightness(1.08);
    box-shadow:
      inset 0 1px 0 hsla(0,0%,100%,0.22),
      0 4px 16px hsla(211,100%,50%,0.45);
  }

  .btn-auth:active {
    transform: scale(0.98);
    filter: brightness(0.96);
  }

  :root[data-theme="dark"] .field input:focus {
    box-shadow:
      0 0 0 3px hsl(215 80% 60% / 0.15),
      inset 0 1px 3px hsla(0,0%,0%,0.04);
  }
  :root[data-theme="dark"] .btn-auth {
    background: linear-gradient(180deg, hsl(215 80% 60%), hsl(215 80% 50%));
    box-shadow:
      inset 0 1px 0 hsla(0,0%,100%,0.20),
      0 2px 8px hsl(215 80% 50% / 0.35);
  }
  :root[data-theme="dark"] .btn-auth:hover {
    box-shadow:
      inset 0 1px 0 hsla(0,0%,100%,0.22),
      0 4px 16px hsl(215 80% 50% / 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .field input:focus {
      box-shadow:
        0 0 0 3px hsl(215 80% 60% / 0.15),
        inset 0 1px 3px hsla(0,0%,0%,0.04);
    }
    :root:not([data-theme="light"]) .btn-auth {
      background: linear-gradient(180deg, hsl(215 80% 60%), hsl(215 80% 50%));
      box-shadow:
        inset 0 1px 0 hsla(0,0%,100%,0.20),
        0 2px 8px hsl(215 80% 50% / 0.35);
    }
    :root:not([data-theme="light"]) .btn-auth:hover {
      box-shadow:
        inset 0 1px 0 hsla(0,0%,100%,0.22),
        0 4px 16px hsl(215 80% 50% / 0.45);
    }
  }

  /* ── Footer link ── */
  .auth-footer {
    font-size: 14px;
    color: var(--color-text-secondary);
    text-align: center;
  }

  .auth-footer a {
    color: var(--color-accent);
    font-weight: 500;
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; }
    .auth-card { padding: 32px 24px; }
  }

  /* ── Theme toggle ── */
  .theme-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--color-elevated);
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.18s, box-shadow 0.18s, transform 0.12s;
    z-index: 90;
  }

  .theme-toggle:hover {
    box-shadow: var(--shadow-elevated);
    background: var(--color-surface);
  }

  .theme-toggle:active { transform: scale(0.96); }

  .theme-toggle .icon-sun  { display: none; }
  .theme-toggle .icon-moon { display: block; }

  :root[data-theme="dark"] .theme-toggle .icon-sun  { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .icon-sun  { display: block; }
    :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
  }
</style>
{% endblock %}

{% block content %}
<main class="auth-page">
  <img src="{% static 'core/img/logo.png' %}" alt="Workflow" class="auth-logo">

  <div class="auth-card">
    <div>
      <h1>Crea un account</h1>
      <p class="auth-subtitle">Unisciti a Workflow</p>
    </div>

    {% if error %}
    <div class="auth-error" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="field-group">

        <!-- Nome e cognome -->
        <div class="field-row">
          <div class="field">
            <label for="first_name">Nome</label>
            <input type="text" id="first_name" name="first_name"
                   autocomplete="given-name" placeholder="Mario">
          </div>
          <div class="field">
            <label for="last_name">Cognome</label>
            <input type="text" id="last_name" name="last_name"
                   autocomplete="family-name" placeholder="Rossi">
          </div>
        </div>

        <div class="field-divider"></div>

        <!-- Credenziali -->
        <div class="field">
          <label for="username">Username <span style="color:var(--color-danger)">*</span></label>
          <input type="text" id="username" name="username"
                 autocomplete="username" required autofocus placeholder="mario.rossi">
        </div>
        <div class="field">
          <label for="email">Email <span style="color:var(--color-danger)">*</span></label>
          <input type="email" id="email" name="email"
                 autocomplete="email" required placeholder="mario@azienda.it">
        </div>

        <div class="field-divider"></div>

        <!-- Password -->
        <div class="field">
          <label for="password1">Password <span style="color:var(--color-danger)">*</span></label>
          <input type="password" id="password1" name="password1"
                 autocomplete="new-password" required placeholder="Minimo 8 caratteri">
        </div>
        <div class="field">
          <label for="password2">Conferma password <span style="color:var(--color-danger)">*</span></label>
          <input type="password" id="password2" name="password2"
                 autocomplete="new-password" required placeholder="Ripeti la password">
        </div>

      </div>
      <button type="submit" class="btn-auth" style="margin-top: 8px;">Crea account</button>
    </form>

    <p class="auth-footer">
      Hai già un account?
      <a href="{% url 'login' %}">Accedi</a>
    </p>
  </div>
</main>

<!-- ── Theme toggle ── -->
<button class="theme-toggle" id="theme-toggle-btn" aria-label="Cambia tema">
  <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.38-1.41 0z"/>
  </svg>
  <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
  </svg>
</button>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('theme-toggle-btn');
  btn.addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme');
    var isDark = current === 'dark' ||
      (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
})();
</script>
{% endblock %}
