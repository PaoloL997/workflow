{# Shared export format chooser (Excel without header / PDF with Document Status header). #}
<style>
  .export-wrap {
    position: relative;
    display: inline-flex;
  }
  .export-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 400;
    min-width: 180px;
    padding: 6px;
    border-radius: 12px;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    box-shadow: 0 10px 28px hsla(0,0%,0%,0.16);
  }
  .export-menu.open { display: block; }
  .export-menu-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--color-text-primary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .export-menu-btn:hover {
    background: color-mix(in srgb, var(--color-accent) 10%, transparent);
  }
  .export-menu-btn strong {
    font-size: 13px;
    font-weight: 600;
  }
  .export-menu-btn span {
    font-size: 11px;
    color: var(--color-text-secondary);
  }
</style>
<script>
(function () {
  function closeAllExportMenus() {
    document.querySelectorAll('.export-menu.open').forEach(function (el) {
      el.classList.remove('open');
    });
  }

  window.toggleExportMenu = function (btn, event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    const wrap = btn && btn.closest ? btn.closest('.export-wrap') : null;
    const menu = wrap ? wrap.querySelector('.export-menu') : null;
    if (!menu) return;
    const willOpen = !menu.classList.contains('open');
    closeAllExportMenus();
    if (willOpen) menu.classList.add('open');
  };

  window.chooseExportFormat = function (format, event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    closeAllExportMenus();
    if (typeof window.onExportFormatChosen === 'function') {
      window.onExportFormatChosen(format);
    }
  };

  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.export-wrap')) return;
    closeAllExportMenus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAllExportMenus();
  });
})();
</script>
