{# Shared popover markup for Excel-like column filters. #}
<div class="col-filter-popover" id="col-filter-popover" role="dialog" aria-modal="true" aria-labelledby="col-filter-popover-title">
  <div class="col-filter-popover-title" id="col-filter-popover-title"></div>
  <div id="col-filter-popover-body"></div>
  <div class="col-filter-popover-actions">
    <button type="button" class="col-filter-popover-btn" id="col-filter-cancel-btn">Cancella</button>
    <button type="button" class="col-filter-popover-btn primary" id="col-filter-apply-btn">Applica</button>
  </div>
</div>
