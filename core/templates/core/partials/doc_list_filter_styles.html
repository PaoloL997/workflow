{# Shared CSS for column sort + Excel-like filters (emissione / ricezione). #}
<style>
  .sort-label {
    padding: 0;
    border: none;
    background: none;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
  }
  thead th[data-sort-key]:hover .sort-label {
    color: var(--color-text-primary);
  }
  .sort-active .sort-label {
    color: var(--color-accent);
  }

  .list-filter-summary {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-left: 4px;
  }
  .list-filter-count strong {
    color: var(--color-text-primary);
    font-weight: 600;
  }
  .list-filter-reset {
    padding: 0;
    border: none;
    background: none;
    color: var(--color-accent);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .list-filter-reset:hover { opacity: 0.85; }

  .th-inner {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 100%;
  }

  .col-filter-btn {
    flex-shrink: 0;
    padding: 2px;
    border: none;
    background: none;
    color: var(--color-text-secondary);
    opacity: 0;
    cursor: pointer;
    border-radius: 4px;
    line-height: 0;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
  }
  thead th:hover .col-filter-btn,
  th.col-filter-active .col-filter-btn {
    opacity: 0.6;
  }
  th.col-filter-active .col-filter-btn {
    opacity: 1;
    color: var(--color-accent);
  }
  .col-filter-btn:hover {
    opacity: 1 !important;
    color: var(--color-accent);
    background: hsla(0,0%,50%,0.08);
  }
  th.col-filter-active {
    box-shadow: inset 0 -2px 0 var(--color-accent);
  }

  .col-filter-popover {
    position: fixed;
    z-index: 350;
    width: 220px;
    padding: 12px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    box-shadow: 0 8px 28px hsla(0,0%,0%,0.18);
    display: none;
  }
  .col-filter-popover.excel-mode {
    width: 280px;
    padding: 10px 12px 12px;
  }
  .col-filter-popover.date-range-mode {
    width: 292px;
    padding: 10px 12px 12px;
  }
  .col-filter-popover.open { display: block; }

  /* ── Date range filter calendar ── */
  .drf-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .drf-bound {
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: var(--color-elevated);
    min-width: 0;
  }
  .drf-bound-lbl {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    margin-bottom: 2px;
  }
  .drf-bound-val {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .drf-cal {
    border: 1px solid var(--color-border);
    border-radius: 10px;
    background: var(--color-elevated);
    padding: 10px;
  }
  .drf-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .drf-nav {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 7px;
    color: var(--color-text-secondary);
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }
  .drf-nav:hover {
    color: var(--color-text-primary);
    background: hsla(0,0%,50%,0.08);
  }
  .drf-month {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-primary);
  }
  .drf-wdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .drf-wdays span {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    padding-bottom: 4px;
  }
  .drf-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .drf-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 7px;
    font-size: 12px;
    font-family: inherit;
    color: var(--color-text-primary);
    cursor: pointer;
    padding: 0;
  }
  .drf-day:hover:not(.empty) {
    background: hsla(0,0%,50%,0.1);
  }
  .drf-day.empty {
    visibility: hidden;
    cursor: default;
  }
  .drf-day.today {
    color: var(--color-accent);
    font-weight: 700;
  }
  .drf-day.in-range {
    background: color-mix(in srgb, var(--color-accent) 14%, transparent);
    border-radius: 0;
  }
  .drf-day.range-start,
  .drf-day.range-end,
  .drf-day.picking {
    background: var(--color-accent);
    color: #fff;
    font-weight: 600;
  }
  .drf-day.range-start { border-radius: 7px 0 0 7px; }
  .drf-day.range-end { border-radius: 0 7px 7px 0; }
  .drf-day.range-start.range-end,
  .drf-day.picking { border-radius: 7px; }
  .drf-hint {
    margin: 8px 0 0;
    font-size: 11px;
    color: var(--color-text-secondary);
    line-height: 1.35;
  }

  .col-filter-popover-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .col-filter-search {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: var(--color-elevated);
    color: var(--color-text-primary);
    font-size: 13px;
    font-family: inherit;
    box-sizing: border-box;
    margin-bottom: 8px;
  }
  .col-filter-search:focus {
    outline: none;
    border-color: var(--color-accent);
  }
  .col-filter-values-wrap {
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: var(--color-elevated);
    overflow: hidden;
    margin-bottom: 10px;
  }
  .col-filter-values {
    max-height: 200px;
    overflow-y: auto;
    padding: 2px 0;
  }
  .col-filter-value-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    font-size: 13px;
    color: var(--color-text-primary);
    cursor: pointer;
    user-select: none;
  }
  .col-filter-value-row:hover { background: hsla(0,0%,50%,0.06); }
  .col-filter-value-row.hidden { display: none; }
  .col-filter-value-row input[type="checkbox"] {
    flex-shrink: 0;
    margin: 0;
    cursor: pointer;
  }
  .col-filter-value-row span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .col-filter-select-all {
    border-bottom: 1px solid var(--color-border);
    font-weight: 600;
    background: hsla(0,0%,50%,0.04);
  }
  .col-filter-contains-wrap { margin-bottom: 2px; }
  .col-filter-contains-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .col-filter-popover-input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: var(--color-elevated);
    color: var(--color-text-primary);
    font-size: 13px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .col-filter-popover-input:focus {
    outline: none;
    border-color: var(--color-accent);
  }
  .col-filter-popover-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }
  .col-filter-popover-btn {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--color-border);
    background: var(--color-elevated);
    color: var(--color-text-secondary);
  }
  .col-filter-popover-btn:hover {
    color: var(--color-text-primary);
    background: hsla(0,0%,50%,0.08);
  }
  .col-filter-popover-btn.primary {
    background: var(--color-accent);
    border-color: var(--color-accent);
    color: #fff;
  }
  .col-filter-popover-btn.primary:hover { filter: brightness(1.06); }

  .toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--color-border);
    background: var(--color-elevated);
    color: var(--color-text-primary);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .toolbar-btn:hover {
    border-color: var(--color-accent);
    background: color-mix(in srgb, var(--color-accent) 8%, transparent);
  }
</style>
