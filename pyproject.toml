[project]
name = "workflow"
version = "0.1.0"
description = ""
authors = [
    {name = "Paolo Litta",email = "plitta@brembanarolle.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyodbc (>=5.3.0,<6.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "fpdf2 (>=2.8.7,<3.0.0)",
    "psycopg2-binary (>=2.9,<3.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports)
    "W",   # pycodestyle warnings
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line too long — handled by ruff-format
]

[tool.ruff.lint.per-file-ignores]
# Auto-generated migrations: skip all linting
"*/migrations/*.py" = ["E", "F", "W", "I", "UP"]
# Management commands: wildcard imports are common
"core/management/commands/*.py" = ["F401", "F811"]

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
